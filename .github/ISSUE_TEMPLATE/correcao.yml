name: Correção
description: Algo está errado e precisa ser consertado (link quebrado, texto errado, tradução, build falhando)
title: "Corrigir "
labels: ["Correção"]
body:
  - type: textarea
    id: o-que
    attributes:
      label: O que está errado
      description: Onde (página, idioma, arquivo) e o que acontece hoje.
      placeholder: "Na página de cotação em RU, o hreflang aponta para /en/..."
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que deveria acontecer
    validations:
      required: true
  - type: textarea
    id: pronto
    attributes:
      label: Critério de pronto
      description: Como se sabe que acabou.
      placeholder: "hreflang correto nos 4 idiomas; check_links.py com 0 quebrados"
    validations:
      required: true
  - type: input
    id: paginas
    attributes:
      label: Páginas ou arquivos afetados
      placeholder: "content/pages/quote_contact_blog.json, templates/quote.html"
